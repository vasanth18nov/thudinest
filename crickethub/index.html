    <script>
      // Apply the saved colour scheme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('ch-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
      // GitHub Pages has no SPA fallback: the site-wide 404.html redirects deep links here as
      // ?__route=/teams/abc. Put the real path back into the address bar before the router starts.
      (function () {
        var params = new URLSearchParams(location.search);
        var route = params.get('__route');
        if (route !== null) {
          var base = '/crickethub/'.replace(/\/$/, '');
          history.replaceState(null, '', base + (route.charAt(0) === '/' ? route : '/' + route));
        }
      })();
    </script>
