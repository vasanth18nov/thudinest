<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <!-- crickethub-spa-fallback: generated by cricket_app/scripts/deploy.sh -->
    <script>
      // GitHub Pages has no single-page-app fallback. Deep links into CricketHub
      // (e.g. __BASE__teams/abc) land here, so hand them to the app, which restores the path.
      (function () {
        var base = '__BASE__';
        var path = location.pathname;
        if (path.indexOf(base) === 0 && path.length > base.length) {
          var route = path.slice(base.length - 1) + location.search + location.hash;
          location.replace(base + '?__route=' + encodeURIComponent(route));
        }
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3f0e4; color: #0e2318; text-align: center; }
      h1 { font-size: 4rem; margin: 0; }
      a { color: #146c3c; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Sorry, that page doesn't exist.</p>
      <p><a href="/">Go to the home page</a></p>
    </main>
  </body>
</html>
